[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsagent"
version = "0.1.0"
description = "Daily AI newsletter agent as a Claude Code skill plugin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "Druce Vertes", email = "drucev@gmail.com"}]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "click>=8.1",
  "httpx>=0.27",
  "trafilatura>=1.10",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "playwright>=1.49",
  "playwright-stealth>=2.0",
  "openai>=1.50",
  "google-genai>=0.4",
  "choix>=0.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "umap-learn>=0.5",
  "hdbscan>=0.8",
  "optuna>=3.6",
  "scikit-learn>=1.5",
  "Pillow>=10",
  "python-dotenv>=1.0",
  "brightdata-sdk>=2.3",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.pyright]
extraPaths = ["."]
include = ["lib", "tests"]
reportMissingImports = "error"
